<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .screen { display: none; width: 100%; max-width: 480px; padding: 24px 16px 40px; }
  .screen.active { display: block; }
  h1 { font-size: 1.6rem; font-weight: 700; color: #1a202c; margin-bottom: 8px; }
  p.sub { color: #718096; font-size: 0.95rem; margin-bottom: 28px; }
  input[type="text"] {
    width: 100%; padding: 14px; font-size: 1rem;
    border: 2px solid #cbd5e0; border-radius: 10px;
    outline: none; transition: border 0.2s;
    background: #fff;
  }
  input[type="text"]:focus { border-color: #4f46e5; }
  .btn {
    display: block; width: 100%; padding: 15px;
    background: #4f46e5; color: #fff; font-size: 1rem; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    margin-top: 20px; transition: background 0.2s;
  }
  .btn:hover { background: #4338ca; }
  .btn:disabled { background: #a5b4fc; cursor: not-allowed; }
  .progress {
    font-size: 0.82rem; color: #718096; margin-bottom: 4px;
  }
  .progress-bar {
    height: 6px; background: #e2e8f0; border-radius: 99px; margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%; background: #4f46e5; border-radius: 99px;
    transition: width 0.3s;
  }
  .question-card {
    background: #fff; border-radius: 14px; padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 14px;
  }
  .question-card h2 {
    font-size: 1rem; font-weight: 600; color: #2d3748; margin-bottom: 14px;
    line-height: 1.5;
  }
  .option label {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: 8px; cursor: pointer;
    border: 2px solid #e2e8f0; margin-bottom: 8px; background: #f7fafc;
    font-size: 0.95rem; color: #2d3748; transition: border 0.15s, background 0.15s;
  }
  .option input[type="radio"] { accent-color: #4f46e5; width: 18px; height: 18px; flex-shrink: 0; }
  .option input[type="radio"]:checked + span { font-weight: 600; color: #4f46e5; }
  .option label:has(input:checked) { border-color: #4f46e5; background: #eef2ff; }
  .result-card {
    background: #fff; border-radius: 14px; padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 16px;
  }
  .score-big {
    font-size: 3.5rem; font-weight: 800; color: #4f46e5; text-align: center;
    margin: 10px 0 4px;
  }
  .score-label { text-align: center; color: #718096; font-size: 0.9rem; margin-bottom: 18px; }
  .meta-row { display: flex; justify-content: space-between; padding: 10px 0;
    border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
  .meta-row:last-child { border-bottom: none; }
  .meta-row span:first-child { color: #718096; }
  .meta-row span:last-child { font-weight: 600; color: #2d3748; }
  .answer-review { margin-top: 16px; }
  .answer-item {
    background: #fff; border-radius: 10px; padding: 14px 16px;
    margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border-left: 4px solid transparent;
  }
  .answer-item.correct { border-left-color: #38a169; }
  .answer-item.wrong { border-left-color: #e53e3e; }
  .answer-item .q-text { font-size: 0.88rem; color: #4a5568; margin-bottom: 6px; font-weight: 600; }
  .answer-item .a-text { font-size: 0.85rem; color: #2d3748; }
  .answer-item .a-text .correct-ans { color: #38a169; font-weight: 600; }
  .answer-item .a-text .wrong-ans { color: #e53e3e; text-decoration: line-through; }
  .status-icon { float: right; font-size: 1.1rem; }
  .sending { text-align: center; color: #718096; font-size: 0.88rem; margin-top: 10px; }
</style>
</head>
<body>

<!-- ───── SCREEN 1: Name ───── -->
<div class="screen active" id="screen1">
  <h1>📝 Quiz Time</h1>
  <p class="sub">Enter your name to begin the 10-question quiz.</p>
  <input type="text" id="nameInput" placeholder="Your full name" maxlength="60" autocomplete="name">
  <button class="btn" id="startBtn" onclick="startQuiz()">Start Quiz →</button>
</div>

<!-- ───── SCREEN 2: Quiz ───── -->
<div class="screen" id="screen2">
  <div class="progress" id="progressText">Question 0 of 10</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="questionsContainer"></div>
  <button class="btn" id="submitBtn" onclick="submitQuiz()">Submit Answers</button>
</div>

<!-- ───── SCREEN 3: Results ───── -->
<div class="screen" id="screen3">
  <h1>Results</h1>
  <p class="sub">Here's how you did.</p>
  <div class="result-card">
    <div class="score-big" id="scoreBig"></div>
    <div class="score-label" id="scoreLabel"></div>
    <div class="meta-row"><span>Name</span><span id="resName"></span></div>
    <div class="meta-row"><span>Start Time</span><span id="resStart"></span></div>
    <div class="meta-row"><span>Submit Time</span><span id="resEnd"></span></div>
    <div class="meta-row"><span>Time Taken</span><span id="resDuration"></span></div>
  </div>
  <div class="answer-review" id="answerReview"></div>
  <div class="sending" id="sendingStatus"></div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const WORKER_URL = "https://mixture36dmin.jackgerman6.workers.dev/"; // 👈 replace this

// ── QUESTIONS ───────────────────────────────────────────
const questions = [
  {
    q: "What is the powerhouse of the cell?",
    options: ["Nucleus", "Mitochondria", "Ribosome", "Golgi apparatus"],
    answer: 1
  },
  {
    q: "How many planets are in our solar system?",
    options: ["7", "8", "9", "10"],
    answer: 1
  },
  {
    q: "What is the chemical symbol for gold?",
    options: ["Gd", "Go", "Au", "Ag"],
    answer: 2
  },
  {
    q: "Which country has the largest land area?",
    options: ["China", "USA", "Canada", "Russia"],
    answer: 3
  },
  {
    q: "What is 12 × 12?",
    options: ["132", "144", "124", "148"],
    answer: 1
  },
  {
    q: "Which language is primarily used to style web pages?",
    options: ["HTML", "Python", "CSS", "Java"],
    answer: 2
  },
  {
    q: "Who wrote 'Romeo and Juliet'?",
    options: ["Charles Dickens", "William Shakespeare", "Jane Austen", "Homer"],
    answer: 1
  },
  {
    q: "What is the speed of light (approx.) in km/s?",
    options: ["150,000", "300,000", "500,000", "1,000,000"],
    answer: 1
  },
  {
    q: "What gas do plants absorb from the atmosphere?",
    options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"],
    answer: 2
  },
  {
    q: "Which ocean is the largest?",
    options: ["Atlantic", "Indian", "Arctic", "Pacific"],
    answer: 3
  }
];

// ── STATE ───────────────────────────────────────────────
let userName = "";
let startTime = null;

// ── HELPERS ─────────────────────────────────────────────
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

function formatDate(d) {
  return d.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" })
    + " " + d.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit", second:"2-digit" });
}

function secondsToHMS(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
}

// ── SCREEN 1 → 2 ────────────────────────────────────────
function startQuiz() {
  const val = document.getElementById("nameInput").value.trim();
  if (!val) { alert("Please enter your name."); return; }
  userName = val;
  startTime = new Date();
  buildQuiz();
  show("screen2");
}

document.getElementById("nameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") startQuiz();
});

// ── BUILD QUIZ ───────────────────────────────────────────
function buildQuiz() {
  const container = document.getElementById("questionsContainer");
  container.innerHTML = "";

  questions.forEach((q, qi) => {
    const card = document.createElement("div");
    card.className = "question-card";
    card.innerHTML = `<h2>${qi + 1}. ${q.q}</h2>` +
      q.options.map((opt, oi) =>
        `<div class="option">
          <label>
            <input type="radio" name="q${qi}" value="${oi}">
            <span>${opt}</span>
          </label>
        </div>`
      ).join("");
    container.appendChild(card);
  });

  // Live progress update
  document.querySelectorAll('input[type="radio"]').forEach(r => {
    r.addEventListener("change", updateProgress);
  });
  updateProgress();
}

function updateProgress() {
  let answered = 0;
  questions.forEach((_, qi) => {
    if (document.querySelector(`input[name="q${qi}"]:checked`)) answered++;
  });
  document.getElementById("progressText").textContent = `${answered} of 10 answered`;
  document.getElementById("progressFill").style.width = `${(answered / 10) * 100}%`;
  document.getElementById("submitBtn").disabled = answered < 10;
}

// ── SCREEN 2 → 3 ────────────────────────────────────────
function submitQuiz() {
  const submitTime = new Date();

  let score = 0;
  const answers = questions.map((q, qi) => {
    const sel = document.querySelector(`input[name="q${qi}"]:checked`);
    const chosen = sel ? parseInt(sel.value) : -1;
    const correct = chosen === q.answer;
    if (correct) score++;
    return { question: q.q, chosen, correct, correctAnswer: q.answer, options: q.options };
  });

  const diffSec = Math.round((submitTime - startTime) / 1000);

  // ── Populate results ──
  document.getElementById("scoreBig").textContent = `${score}/10`;
  document.getElementById("scoreLabel").textContent =
    score === 10 ? "Perfect score! 🎉" :
    score >= 7  ? "Great job! 👏" :
    score >= 5  ? "Not bad! Keep practising." : "Better luck next time.";
  document.getElementById("resName").textContent = userName;
  document.getElementById("resStart").textContent = formatDate(startTime);
  document.getElementById("resEnd").textContent = formatDate(submitTime);
  document.getElementById("resDuration").textContent = secondsToHMS(diffSec);

  // ── Answer review ──
  const review = document.getElementById("answerReview");
  review.innerHTML = "<h2 style='margin-bottom:12px;font-size:1rem;color:#2d3748'>Answer Breakdown</h2>";
  answers.forEach((a, i) => {
    const div = document.createElement("div");
    div.className = "answer-item " + (a.correct ? "correct" : "wrong");
    div.innerHTML = `
      <span class="status-icon">${a.correct ? "✅" : "❌"}</span>
      <div class="q-text">Q${i+1}. ${a.question}</div>
      <div class="a-text">
        ${a.correct
          ? `<span class="correct-ans">✓ ${a.options[a.correctAnswer]}</span>`
          : `<span class="wrong-ans">${a.chosen >= 0 ? a.options[a.chosen] : "No answer"}</span>
             → <span class="correct-ans">${a.options[a.correctAnswer]}</span>`
        }
      </div>`;
    review.appendChild(div);
  });

  show("screen3");

  // ── Send to Worker ──
  const payload = {
    name: userName,
    score,
    total: 10,
    startTime: startTime.toISOString(),
    submitTime: submitTime.toISOString(),
    durationSeconds: diffSec,
    answers: answers.map(a => ({
      question: a.question,
      chosen: a.chosen >= 0 ? a.options[a.chosen] : "No answer",
      correct: a.correct,
      correctAnswer: a.options[a.correctAnswer]
    }))
  };

  const statusEl = document.getElementById("sendingStatus");
  statusEl.textContent = "Sending results…";

  fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(r => {
    if (!r.ok) throw new Error("Non-OK response");
    statusEl.textContent = "✓ Results submitted successfully.";
  })
  .catch(() => {
    statusEl.textContent = "⚠️ Could not send results to server.";
  });
}
</script>
</body>
</html>
